name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  capture-smoke:
    name: capture → analyze smoke (real Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs Lighthouse against two local servers (1st / 3rd party) with the
      # runner's preinstalled Chrome, then runs each analyzer on the result.
      # Catches Lighthouse upgrades that drop audits the analyzers read.
      - run: npm run test:smoke

  binary-smoke:
    name: bun build --compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      # Compile the standalone analyzer binary and verify it boots (the analyze
      # commands are pure JS; capture needs bun/node — see README).
      - run: bun build --compile --outfile ./third-party-analyzer src/cli.ts
      - run: ./third-party-analyzer --help
